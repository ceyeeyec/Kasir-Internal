<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masuk | FACETHEHTIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page login-single-page">
  <main class="login-single-wrap">
    <section class="login-single-card" aria-label="Form login FACETHEHTIC">
      <div class="login-logo-wrap">
        <img class="login-logo" src="/assets/facethethic-logo.png" alt="Logo FACETHEHTIC">
      </div>

      <h1>Selamat datang kembali</h1>
      <p class="login-single-sub">Masuk ke dashboard FACETHEHTIC</p>

      <form id="loginForm" novalidate>
        <div class="field-block">
          <label for="username">ID pegawai</label>
          <div class="input-shell">
            <span class="input-icon">ID</span>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="Masukkan ID pegawai" required autofocus>
          </div>
        </div>

        <div class="field-block password-field">
          <label for="password">Kata sandi</label>
          <div class="input-shell">
            <span class="input-icon">••</span>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan kata sandi" required>
            <button type="button" class="password-toggle" id="showPass" aria-label="Tampilkan kata sandi">Lihat</button>
          </div>
        </div>

        <div id="error" class="login-error" role="alert" aria-live="polite"></div>

        <button type="submit" class="login-submit" id="loginButton">
          <span>Masuk</span><span aria-hidden="true">→</span>
        </button>
      </form>
    </section>
  </main>
<script src="/js/login.js"></script>
</body>
</html>
